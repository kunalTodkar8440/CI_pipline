name: exlearn parallel jobs

on:
    workflow_dispatch:
jobs:
  job-1:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Job 1"
  job-2:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Job 2"
  job-3:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Job 3 runs after Job 1 and Job 2"