name: exlearn parallel needs block added

on:
  push:
    branches:
      - CI_branch
      - main 
jobs:
  job-1:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "job 1"
  job-2:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "job 2"
  job-3:
    runs-on: ubuntu-24.04
    needs:
      - job-1
      - job-2
    steps:
          - run: echo "Job 3 runs after Job 1 and Job 2"